services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server-monitor
    restart: unless-stopped
    pid: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Mapeo explícito al puerto 8090 (configurable mediante .env)
      - "${PORT:-8090}:8090"
    environment:
      - PORT=8090
      - TZ=UTC
    volumes:
      # Socket de Docker con permisos para escanear, reiniciar y apagar contenedores
      - /var/run/docker.sock:/var/run/docker.sock
      # Montaje para lectura precisa del disco del host
      - /:/host:ro
      # Montaje de /proc del host para escanear puertos de Apache, Nessus y servicios nativos
      - /proc:/host/proc:ro
      # Montaje de /run para detectar PIDs de Apache, Nessus y servicios systemd
      - /run:/host/run:ro
      # Montaje para detectar versión de Ubuntu Server y Hostname
      - /etc/os-release:/etc/host-os-release:ro
      - /etc/hostname:/etc/host_hostname:ro
      # Persistencia de configuraciones (programador de actualizaciones automáticas)
      - ./app/data:/app/app/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 48M
